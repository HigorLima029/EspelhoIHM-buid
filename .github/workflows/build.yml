name: build-exe
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PyInstaller
        run: pip install pyinstaller
      - name: Gerar o executavel
        run: pyinstaller --onefile --noconsole --name EspelhoIHM espelho_ihm.py
      - name: Publicar o .exe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EspelhoIHM-windows
          path: dist/EspelhoIHM.exe
